<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>我的修仙日记 · 五职业人物立绘</title><style>
:root{color-scheme:light;--ink:#253330;--muted:#7b8073;--green:#416c59;--paper:#f5f1e8}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Microsoft YaHei",system-ui,sans-serif}main{max-width:1360px;margin:auto;padding:36px 26px 28px}header{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:26px}.eyebrow{font-size:12px;letter-spacing:3px;color:var(--green);margin:0 0 10px}h1{font-family:"Songti SC","SimSun",serif;font-size:32px;letter-spacing:3px;margin:0}header>p{font-size:13px;color:var(--muted);margin:0 0 3px}.gallery{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:15px}.card{cursor:pointer;text-align:left;font:inherit;color:inherit;border:1px solid #deded1;border-radius:12px;background:#faf8f2;padding:0;overflow:hidden;transition:border-color .15s,box-shadow .15s}.card:hover,.card:focus-visible{border-color:var(--green);box-shadow:0 6px 24px #3b554d12;outline:2px solid #416c5930;outline-offset:3px}.art{height:410px;display:flex;align-items:center;justify-content:center;padding:12px 6px;background:radial-gradient(ellipse at center,#fffdf7,#ececde)}.art img{height:100%;width:100%;object-fit:contain;display:block}.caption{padding:18px 17px 19px;border-top:1px solid #e8e5d8}.job{font-size:11px;color:var(--green);letter-spacing:2px}h2{font-family:"Songti SC","SimSun",serif;font-weight:600;font-size:24px;letter-spacing:3px;margin:7px 0 9px}.caption p{font-size:12px;color:var(--muted);margin:0;line-height:1.7}footer{font-size:12px;color:var(--muted);margin-top:22px;display:flex;justify-content:space-between;gap:20px}dialog{border:1px solid #ddd8c7;border-radius:14px;padding:0;background:#f4f1e6;max-width:min(860px,94vw);width:100%;max-height:94vh;color:var(--ink)}dialog::backdrop{background:#18231ee0}.detail-head{display:flex;justify-content:space-between;align-items:center;padding:13px 18px;border-bottom:1px solid #dfddce}.detail-head strong{font-size:17px;letter-spacing:2px}.close{border:0;border-radius:6px;background:#e7e8dd;font-size:20px;cursor:pointer;width:34px;height:34px}.detail-art{height:min(76vh,960px);display:flex;justify-content:center;padding:12px;background:radial-gradient(ellipse,#fffef7,#e9e9dc)}.detail-art img{height:100%;max-width:100%;object-fit:contain}.detail-foot{display:flex;justify-content:center;padding:12px}a{color:var(--green);font-size:13px;text-underline-offset:3px}@media(max-width:1080px){.gallery{grid-template-columns:repeat(3,minmax(0,1fr))}.art{height:360px}}@media(max-width:700px){main{padding:26px 18px}header{display:block;margin-bottom:20px}header>p{margin-top:13px}h1{font-size:28px}.gallery{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.art{height:360px;padding:10px 4px}.caption{padding:14px}.caption p{font-size:11px}footer{font-size:11px}}@media(max-width:430px){.art{height:280px}h2{font-size:21px}.caption{padding:12px}}
</style></head><body><main><header><div><p class="eyebrow">我的修仙日记</p><h1>五职业人物立绘</h1></div><p>点击人物，查看完整立绘</p></header><section class="gallery" aria-label="五职业人物"><button class="card" data-character="swordsman-luqinglan" aria-label="查看陆青岚完整立绘"><div class="art"><img src="swordsman-luqinglan.png" alt="陆青岚，剑士，完整全身立绘" width="1024" height="1536"></div><div class="caption"><span class="job">剑士</span><h2>陆青岚</h2><p>白衣青袍，长剑问道</p></div></button>
<button class="card" data-character="healer-shenzhiwei" aria-label="查看沈知微完整立绘"><div class="art"><img src="healer-shenzhiwei.png" alt="沈知微，医师，完整全身立绘" width="1024" height="1536"></div><div class="caption"><span class="job">医师</span><h2>沈知微</h2><p>青白长裙，悬壶济世</p></div></button>
<button class="card" data-character="saber-hanpoyue" aria-label="查看韩破岳完整立绘"><div class="art"><img src="saber-hanpoyue.png" alt="韩破岳，刀客，完整全身立绘" width="1024" height="1536"></div><div class="caption"><span class="job">刀客</span><h2>韩破岳</h2><p>赤衣重刀，粗犷沉稳</p></div></button>
<button class="card" data-character="assassin-xieqian" aria-label="查看谢潜完整立绘"><div class="art"><img src="assassin-xieqian.png" alt="谢潜，刺客，完整全身立绘" width="1024" height="1536"></div><div class="caption"><span class="job">刺客</span><h2>谢潜</h2><p>夜色兜帽，双刃潜行</p></div></button>
<button class="card" data-character="mage-suyingyue" aria-label="查看苏映月完整立绘"><div class="art"><img src="mage-suyingyue.png" alt="苏映月，法师，完整全身立绘" width="1024" height="1536"></div><div class="caption"><span class="job">法师</span><h2>苏映月</h2><p>银发月杖，观星御灵</p></div></button></section><footer><span>陆青岚 · 沈知微 · 韩破岳 · 谢潜 · 苏映月</span><span>共 5 位角色</span></footer></main><dialog aria-label="完整人物立绘"><div class="detail-head"><strong id="detail-title"></strong><button class="close" aria-label="关闭完整立绘">×</button></div><div class="detail-art"><img id="detail-image" alt=""></div><div class="detail-foot"><a id="download" download>下载透明底原图</a></div></dialog><script>
const cast = [{"id":"swordsman-luqinglan","name":"陆青岚","profession":"剑士"},{"id":"healer-shenzhiwei","name":"沈知微","profession":"医师"},{"id":"saber-hanpoyue","name":"韩破岳","profession":"刀客"},{"id":"assassin-xieqian","name":"谢潜","profession":"刺客"},{"id":"mage-suyingyue","name":"苏映月","profession":"法师"}];
const dialog = document.querySelector('dialog');
document.querySelectorAll('.card').forEach(card => card.addEventListener('click', () => {
  const c = cast.find(c => c.id === card.dataset.character);
  document.querySelector('#detail-title').textContent = c.name + ' · ' + c.profession;
  const image = document.querySelector('#detail-image');
  image.src = c.id + '.png';
  image.alt = c.name + '完整全身立绘';
  document.querySelector('#download').href = c.id + '.png';
  dialog.showModal();
}));
document.querySelector('.close').addEventListener('click', () => dialog.close());
dialog.addEventListener('click', event => {if(event.target === dialog) dialog.close();});
</script></body></html>
